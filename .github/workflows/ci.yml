name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Tests
        run: pytest -q
      - name: Full build (generate, validate, model, export)
        run: python -m etl.build
      - name: Upload Power BI extracts
        uses: actions/upload-artifact@v4
        with:
          name: powerbi-extracts
          path: output/powerbi/
